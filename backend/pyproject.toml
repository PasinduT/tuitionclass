[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pahas-api"
version = "0.1.0"
description = "FastAPI service for Tuition Class AI extraction and grading workflows"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "google-genai>=1.0,<2",
  "pydantic-settings>=2.7,<3",
  "supabase>=2.13,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
